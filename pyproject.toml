[project]
name = "createcompletelang"
version = "0.1.0"
description = "CreateCompleteLang: interpretable semantic-graph framework to detect and fill semantic gaps intra- and cross-lingually (Marathi-focused)."
readme = "README.md"
requires-python = ">=3.12"

authors = [{ name = "ppers" }]
keywords = ["semantic gaps", "SVD", "LSA", "semantic graph", "cross-lingual", "marathi", "NLP"]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "pandas>=2.1",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "pydantic>=2.6",
  "zstandard>=0.22",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.3",
  "isort>=5.13",
  "mypy>=1.10",
  "ipykernel>=6.29",
  "jupyter>=1.0",
]
cpp = [
  "pybind11>=2.12"
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5"
]

# CLI-команды для этапов пайплайна
[project.scripts]
cclang-parse-corpus = "pipelines.parse_corpus:main"
cclang-build-cooc = "pipelines.build_cooc:main"
cclang-run-svd = "pipelines.run_svd:main"
cclang-build-graph = "pipelines.build_semantic_graph:main"
cclang-find-gaps = "pipelines.find_gaps:main"
cclang-align = "pipelines.align_crosslingual:main"
cclang-find-iso = "pipelines.find_isomorphisms:main"
cclang-fill-cross = "pipelines.fill_crosslingual:main"
cclang-fill-intra = "pipelines.fill_intralingual:main"
cclang-report = "pipelines.generate_report:main"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cclang*", "pipelines*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
exclude = ["data/", ".venv/"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
