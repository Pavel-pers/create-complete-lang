[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "createcompletelang"
version = "0.1.0"
description = "CreateCompleteLang: interpretable semantic-graph framework to detect and fill semantic gaps intra- and cross-lingually (Marathi-focused)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ppers" }]
keywords = ["semantic gaps", "SVD", "LSA", "semantic graph", "cross-lingual", "marathi", "NLP"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "zstandard>=0.22",
    "matplotlib>=3.8",
    "pytesseract>=0.3.13",
    "boto3>=1.34",
    "pdf2image>=1.17.0",
    "indic-nlp-library>=0.92",
    "python-dotenv>=1.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=24.3",
    "isort>=5.13",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]
cpp = [
    "pybind11>=2.12",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
cclang-discover-links = "pipelines.corpus.discover_links:main"
cclang-fetch-pdfs = "pipelines.corpus.fetch_pdfs:main"
cclang-extract_text = "pipelines.corpus.extract_text:main"
cclang-tokenize-text = "pipelines.corpus.tokenize_text:main"
cclang-lemmatize-text = "pipelines.corpus.lemmatization:main"
upload-local-to-s3 = "scripts.upload_local_to_s3:main"
load-from-s3 = "scripts.load_local_from_s3:main"
cclang-build-vocab = "pipelines.corpus.build_vocab:main"
cclang-explore-vocabulary = "scripts.explore.vocabulary:main"
cclang-explore-lemma-stats = "scripts.explore.lemma_stats:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["cclang*", "pipelines*", "scripts*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["E501"]
exclude = ["data/", ".venv/"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
pretty = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --disable-warnings"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests with real S3 (deselect with '-m \"not e2e\"')",
]
